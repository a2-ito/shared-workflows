name: Security

# このリポジトリ自身にも同じ検査をかける。PR では変更した再利用ワークフローそのものが動くので、
# 他のリポジトリに広がる前にここで壊れていないか確かめられる。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 毎日 6:00 (JST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    uses: ./.github/workflows/trivy.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    uses: ./.github/workflows/codeql.yml
    with:
      languages: '["actions"]'
    permissions:
      contents: read
      security-events: write
